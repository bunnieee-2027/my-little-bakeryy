function sit(c){if(gst.length<seatN()&&Math.random()<.4+.1*S.up.ac+.05*S.up.seat)gst.push({a:c.a,n:c.n,e:REC[c.r].e,t:22+Math.random()*20+6*S.up.ac,chat:pk(CH1)})}
function guestTick(){let ch=false;gst.forEach(g=>{g.t--;if(S.clock%9===0){g.chat=pk(gst.length>1?CH2:CH1);ch=true}});const n=gst.length;gst=gst.filter(g=>g.t>0);if(gst.length!==n)ch=true;if(ch){const e=$('#seats');if(e)e.innerHTML=seatsH()}}
/* Tray */
let TG=[];const trayUsed=()=>Object.values(S.tray).reduce((a,b)=>a+b.length,0),trayCap=()=>40+10*S.up.cab,gk=x=>(x.o?'o':'')+(x.f||'')+'|'+(x.t||[]).join('');
const trayV=()=>'🧺 <b>Khay bánh</b> '+(Object.entries(S.tray).filter(([,a])=>a.length).map(([r,a])=>`<span>${REC[r].e}×${a.length}</span>`).join(' ')||'<span class="sm">trống</span>')+' <span class="bin" title="Thùng rác">🗑️'+(S.dd.trash?' ×'+S.dd.trash:'')+'</span>';
function trayCard(){TG=[];for(const r in S.tray)S.tray[r].forEach(x=>{const key=r+'|'+gk(x);let o=TG.find(y=>y.key===key);if(!o)TG.push(o={key,r,gk:gk(x),f:x.f||'',t:x.t||[],n:0,q:0});o.n++;o.q+=x.q});
return `<div class="card"><div class="row"><h3>🧺 Khay bánh</h3><span class="pill">${trayUsed()}/${trayCap()}</span></div><p class="sm">Bánh vừa nướng nằm ở khay và chưa thể bán. Đưa bánh lên tủ trưng bày để khách mua; tủ đang có ${kinds()}/${kcap()} loại. Bánh hỏng hoặc sai yêu cầu thì bấm 🗑️ để bỏ rồi làm lại.</p>${TG.length?TG.map((o,i)=>`<div class="row"><span>${REC[o.r].e} ${REC[o.r].n}${o.f||o.t.length?' · '+ordT(o):''}${o.gk[0]==='o'?' <span class="sm">(đơn riêng)</span>':''} <b>×${o.n}</b> <span class="sm">${stars(o.q/o.n)}${o.q/o.n<.4?' ⚠️ chất lượng thấp':''}</span></span><span><button class="btn alt" data-up="${i}" data-n="1">⬆️ 1</button> <button class="btn alt" data-up="${i}" data-n="99">⬆️ Hết</button> <button class="btn neg" data-tr="${i}" data-n="1" aria-label="Bỏ 1 phần">🗑️ 1</button> <button class="btn neg" data-tr="${i}" data-n="99" aria-label="Bỏ tất cả">🗑️ Hết</button></span></div>`).join(''):'<p class="sm">Khay trống — vào Bếp nướng bánh nhé.</p>'}</div>`}
function toShelf(i,n){const o=TG[i];if(!o)return;const R=REC[o.r],src=S.tray[o.r];let m=0;
for(let j=src.length-1;j>=0&&m<n;j--){if(gk(src[j])!==o.gk)continue;if(!S.shelf[o.r].length&&kinds()>=kcap()&&!src[j].o){toast('Tủ đã đủ '+kcap()+' loại, hãy hạ bớt một loại xuống khay');break}
if(R.cold?usedC()>=cap2():used()>=cap()){toast(R.cold?'Cần Tủ mát (còn chỗ) để trưng bánh lạnh':'Tủ trưng bày đã đầy');break}
S.shelf[o.r].push(src.splice(j,1)[0]);m++}if(m)beep(700,.08);save();rCounter()}
function toTray(r){const src=S.shelf[r];while(src.length&&trayUsed()<trayCap())S.tray[r].push(src.pop());if(src.length)toast('Khay bánh đã đầy');beep(500,.08);save();rCounter()}
function bindTray(){document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{const y=scrollY;trashTray(+b.dataset.tr,+b.dataset.n);scrollTo(0,y)});document.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{const y=scrollY;trashShelf(b.dataset.ts);scrollTo(0,y)});document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const y=scrollY;toShelf(+b.dataset.up,+b.dataset.n);scrollTo(0,y)});document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const y=scrollY;toTray(b.dataset.dn);scrollTo(0,y)})}
/* Trash */
function trashTray(i,n){const o=TG[i];if(!o)return;if(n>1&&o.n>1&&!confirm('Bỏ '+o.n+' phần '+REC[o.r].n+' trong khay?'))return;const src=S.tray[o.r];let m=0;for(let j=src.length-1;j>=0&&m<n;j--)if(gk(src[j])===o.gk){src.splice(j,1);m++}S.dd.trash=(S.dd.trash||0)+m;toast('🗑️ Đã bỏ '+m+' phần '+REC[o.r].n);beep(300,.15);save();rCounter()}
function trashShelf(r){const n=S.shelf[r].length;if(!n||!confirm('Bỏ '+n+' phần '+REC[r].n+' trên tủ?'))return;S.shelf[r]=[];S.dd.trash=(S.dd.trash||0)+n;toast('🗑️ Đã bỏ '+n+' phần '+REC[r].n);beep(300,.15);save();rCounter()}
/* Step feedback */
const bad=()=>k&&k.sc.some(x=>x<.6),fb=()=>{if(!k.sc.length)return '';const x=k.sc[k.sc.length-1],L=STEPS[k.sc.length-1];return `<p class="${x<.6?'bad':'ok'}" style="margin:6px 0"><b>${L}:</b> ${x>=.85?'rất chuẩn ✅':x>=.6?'tạm ổn':(k.ord&&k.sc.length===5?'trang trí chưa đúng đơn ⚠️':'chưa chuẩn ⚠️ bánh sẽ kém ngon')+'. Bạn có thể bấm “Bỏ & làm lại” ngay.'}</p>`};
/* Boot */
function start(){$('#menu').style.display='none';cust=[];gst=[];k=null;tab='counter';spawnT=99;render();if(S.day===1&&!S.served&&!trayUsed()&&!used())toast('Vào Bếp nướng bánh, rồi đưa bánh từ khay lên tủ trưng bày nhé!')}
function doNew(){try{['mlb_save_v1','mlb_save_v1_b',KEY,KEY+'_b'].forEach(x=>localStorage.removeItem(x))}catch(e){}S=fresh();cust=[];k=null;$('#cf').hidden=true;cp={name:'',g:'f',skin:SK[0],hair:HC[1],shirt:'#ffffff',st:2,hat:1,ap:'#f9c6d3',ac:'#e5688f',gl:0,tab:0};ccUI();$('#cc').hidden=false}
$('#cont').onclick=()=>{const v=load();if(v){S=v;start()}};
$('#newg').onclick=()=>{if(load()&&$('#cf').hidden){$('#cf').hidden=false;return}doNew()};
$('#cfy').onclick=doNew;$('#cfn').onclick=()=>$('#cf').hidden=true;
$('#sv').onclick=()=>{save();toast('Đã lưu game 💾')};
$('#mn').onclick=()=>{save();$('#cont').style.display=load()?'':'none';$('#cf').hidden=true;$('#menu').style.display='flex'};
$('#snd').onclick=()=>{mute=!mute;$('#snd').textContent=mute?'🔇':'🔊'};
if(!load())$('#cont').style.display='none';
const MAIL='banhtrangmeden000@gmail.com';
$('#fb').href='mailto:'+MAIL+'?subject='+encodeURIComponent('Góp ý cho My Little Bakery');
['pointerdown','touchend'].forEach(e=>addEventListener(e,()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(x){}},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)save()});

$('#hm').onclick=()=>{if($('#menu').style.display==='none'&&S){paused=true;$('#pm').hidden=false}};
$('#pr').onclick=()=>{paused=false;$('#pm').hidden=true};
$('#vol').oninput=e=>{vol=e.target.value/100;mute=vol===0;$('#snd').textContent=mute?'🔇':'🔊'};
$('#pq').onclick=()=>{paused=false;$('#pm').hidden=true;$('#mn').click()};
setInterval(tick,1000);setInterval(()=>S&&save(),20000);
</script></body></html>
